version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: soccer
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "3050:3050"
    environment:
      MONGODB_URL: mongodb://mongodb:27017/soccer
      NODE_ENV: development
      PORT: 3050
      FOOTBALL_DATA_API_KEY: ${FOOTBALL_DATA_API_KEY:-your_key_here}
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3050
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
